name: Daily price collection

# The Worker starts the workflow at 10:00 Athens time. This schedule remains a
# fallback and the collector's daily guard prevents duplicate reports.
on:
  schedule:
    - cron: "7,27,47 7-11 * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: Started by the Cloudflare daily scheduler
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-price-collection
  cancel-in-progress: false

jobs:
  collect:
    if: vars.PRICE_TRACKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRICE_TRACKER_STORE_URL: ${{ secrets.PRICE_TRACKER_STORE_URL }}
      PRICE_TRACKER_STORE_NAME: ${{ vars.PRICE_TRACKER_STORE_NAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRICE_TRACKER_DAILY_TIME: ${{ vars.PRICE_TRACKER_DAILY_TIME || '10:00' }}
      PRICE_TRACKER_TIMEZONE: ${{ vars.PRICE_TRACKER_TIMEZONE || 'Europe/Athens' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate store configuration
        run: |
          if [ -z "$PRICE_TRACKER_STORE_URL" ]; then
            echo "::error::Set the PRICE_TRACKER_STORE_URL repository secret."
            exit 1
          fi

      - name: Prepare the private product list
        env:
          PRODUCT_URLS: ${{ secrets.PRICE_TRACKER_PRODUCTS }}
        run: |
          if [ -z "$PRODUCT_URLS" ]; then
            echo "::error::Set the PRICE_TRACKER_PRODUCTS repository secret."
            exit 1
          fi
          printf '%s\n' "$PRODUCT_URLS" > products.txt

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: data/prices.sqlite3
          key: price-history-${{ github.run_id }}
          restore-keys: price-history-

      - name: Remember the history checksum
        id: before
        run: echo "sum=$( (sha256sum data/prices.sqlite3 2>/dev/null || true) | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Collect scheduled prices
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.scheduled)
        run: python app.py --sync-products products.txt --collect-if-due

      - name: Collect prices on demand
        if: github.event_name == 'workflow_dispatch' && !inputs.scheduled
        run: python app.py --sync-products products.txt --collect

      - name: Check whether the history changed
        id: after
        if: always()
        run: echo "sum=$( (sha256sum data/prices.sqlite3 2>/dev/null || true) | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Save price history
        if: always() && steps.after.outputs.sum != '' && steps.after.outputs.sum != steps.before.outputs.sum
        uses: actions/cache/save@v4
        with:
          path: data/prices.sqlite3
          key: price-history-${{ github.run_id }}
