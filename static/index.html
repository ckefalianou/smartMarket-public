<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>smartMarket</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <p class="eyebrow">Ημερήσια παρακολούθηση τιμών</p>
          <h1>smartMarket</h1>
          <p class="intro">Ιστορικό τιμών, μέσοι όροι και φθηνότερη ημέρα εβδομάδας.</p>
        </div>
        <button id="collect-button" class="button button-primary" type="button">Συλλογή τώρα</button>
      </header>

      <section id="location-note" class="notice" aria-live="polite"></section>
      <section id="telegram-note" class="notice notice-muted" aria-live="polite"></section>
      <p id="page-status" class="status" role="status" aria-live="polite"></p>

      <section class="panel">
        <h2>Προϊόντα</h2>
        <form id="product-form" class="add-form">
          <label for="product-url">URL προϊόντος από <span id="store-name">το κατάστημα</span></label>
          <div class="form-row">
            <input id="product-url" name="url" type="url" placeholder="https://..." required>
            <button class="button button-secondary" type="submit">Προσθήκη</button>
          </div>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Προϊόν</th>
                <th>Κατηγορία</th>
                <th>Τιμή / τεμ.</th>
                <th>Μ.ό. / τεμ.</th>
                <th>Προσφορά</th>
                <th>Κέρδος</th>
                <th>Σύγκριση</th>
                <th>Φθηνότερη μέρα</th>
                <th>Ιστορικό (14 ημέρες)</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="products-body"></tbody>
          </table>
          <p id="empty-state" class="empty-state">Δεν υπάρχουν προϊόντα. Πρόσθεσε το πρώτο URL για να ξεκινήσεις.</p>
        </div>
      </section>

      <footer>
        <span id="schedule-info"></span>
        <span id="last-run-info"></span>
      </footer>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
